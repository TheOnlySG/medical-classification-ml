<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SymptiSense - Diabetes Report</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1 class="mb-5">{{ prediction }}</h1>

        <img src="{{ url_for('static' , filename='graphs/diabetes_glucose.jpg') }}" alt="Glucose Graph"
            class="img-fluid mb-4">

        <img src="{{ url_for('static' , filename='graphs/diabetes_bmi.jpg') }}" alt="BMI Graph" class="img-fluid mb-4">

        <img src="{{ url_for('static' , filename='graphs/diabetes_insulin.jpg') }}" alt="Insulin Graph"
            class="img-fluid mb-4">

        <img src="{{ url_for('static' , filename='graphs/diabetes_final.jpg') }}" alt="Diabetes Final Graph"
            class="img-fluid mb-5">

        <div class="container mt-5">

            <h2 class="mb-4">Patient Health Comparison</h2>

            <table class="table table-bordered table-striped table-hover">

                <thead class="table-dark">
                    <tr>
                        <th>Feature</th>
                        <th>Healthy Median</th>
                        <th>Your Value</th>
                    </tr>
                </thead>

                <tbody>

                    {% for row in comparison_table %}

                    <tr>
                        <td>{{ row['Features'] }}</td>
                        <td>{{ row['Healthy Median'] }}</td>
                        <td>{{ row['Your Values'] }}</td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
